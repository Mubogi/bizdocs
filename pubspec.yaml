name: bizdocs
description: BizDocs — offline-first invoicing, receipts, quotations and letters for SMEs.
publish_to: 'none'
version: 1.2.1+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path_provider: ^2.1.2
  pdf: ^3.10.7
  share_plus: ^13.3.0
  signature: ^5.4.0
  url_launcher: ^6.2.5
  intl: ^0.19.0
  crypto: ^3.0.3
  path: ^1.9.0
  uuid: ^4.4.0
  printing: ^5.15.0
  mobile_scanner: ^7.4.0
  file_picker: ^12.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
