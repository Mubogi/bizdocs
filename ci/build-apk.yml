name: Build APK & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest
    env:
      APP_VERSION: 1.0.0
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --empty --org com.mubogi --project-name bizdocs --platforms=android .

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Package artifact
        run: mv build/app/outputs/flutter-apk/app-release.apk "BizDocs-${APP_VERSION}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: BizDocs v${{ env.APP_VERSION }}
          files: BizDocs-${{ env.APP_VERSION }}.apk
          generate_release_notes: true
